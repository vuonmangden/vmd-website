packages:
  - apps/*
  - packages/*

engineStrict: true
nodeVersion: 24.14.0
runtimeOnFail: error

overrides:
  '@playwright/test': 1.55.1
  playwright: 1.55.1
  js-yaml: 5.2.2

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@nestjs/bull-shared@11.0.5'
  - '@nestjs/bullmq@11.0.5'
