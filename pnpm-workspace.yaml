packages:
  - apps/*
  - packages/*

engineStrict: true
nodeVersion: 24.14.0
runtimeOnFail: error

overrides:
  '@playwright/test': 1.55.1
  playwright: 1.55.1
  js-yaml: 5.2.2
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf and
  # GHSA-jqff-g426-hqxp: Prisma's AJV dependency must use the patched URI parser.
  fast-uri: 3.1.6
  deepmerge-ts: ^8.0.1
  # GHSA-3f6p-5ww8-9rcr: Prisma currently pulls mysql2 transitively even though
  # VMD uses PostgreSQL. Keep every install on the patched driver.
  mysql2: 3.22.0

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@nestjs/bull-shared@11.0.5'
  - '@nestjs/bullmq@11.0.5'
