name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 11.9.0

jobs:
  quality:
    name: Quality, schema and Compose gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          node --version
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        env: { TURBO_FORCE: "true", TURBO_CONCURRENCY: "1" }
        run: pnpm lint

      - name: Type check
        env: { TURBO_FORCE: "true", TURBO_CONCURRENCY: "1" }
        run: pnpm typecheck

      - name: Test
        env: { TURBO_FORCE: "true", TURBO_CONCURRENCY: "1" }
        run: pnpm test

      - name: Build
        env: { TURBO_FORCE: "true", TURBO_CONCURRENCY: "1" }
        run: pnpm build

      - name: Validate Prisma schema and migrations
        run: pnpm ci:prisma

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example -f infrastructure/docker/compose.yaml config --quiet

      - name: Validate workflow syntax
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro"
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color /repo/.github/workflows/ci.yml

  security:
    name: Secret and dependency gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro"
          zricethezav/gitleaks@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a
          git /repo --redact --no-banner

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
